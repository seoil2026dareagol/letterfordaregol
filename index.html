<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>〈우리 다래골은〉 영상 편지함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #f3ead6; --paper: #fbf5e6; --paper-2: #fffaf0;
    --green: #2f4a38; --green-2: #3f6049; --ink: #3a2f24; --muted: #8a7a63; --line: #d8c9a8; --rust: #a9502f;
    --hand: "Gaegu", "Nanum Pen Script", "Apple SD Gothic Neo", "Malgun Gothic", cursive;
    --serif: "Gowun Batang", "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--serif);
    touch-action: manipulation;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(800px 500px at 100% 100%, rgba(150,120,70,.12), transparent 60%),
      var(--ivory);
  }
  body.kiosk { -webkit-user-select: none; user-select: none; }
  .hidden, [hidden] { display: none !important; }
  button { font: inherit; }

  header { text-align: center; padding: 26px 16px 6px; }
  .play { font-size: 14px; letter-spacing: .3em; color: var(--green); display: inline-block; padding: 4px 8px; cursor: default; }
  header h1 { margin: 2px 0 0; font-family: var(--hand); font-weight: 700; font-size: 42px; color: var(--green); line-height: 1.1; }
  header .rule { width: 160px; margin: 10px auto 8px; border-top: 1px solid var(--green); border-bottom: 1px solid var(--green); height: 4px; opacity: .55; }
  header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

  main { max-width: 980px; margin: 0 auto; padding: 14px 14px 40px; }

  /* 이름표 카드 */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 14px; padding-top: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(5, 1fr); } }
  .actor {
    position: relative; background: var(--paper-2); border: 1px solid var(--line); padding: 20px 10px 18px; text-align: center;
    cursor: pointer; color: inherit; font: inherit;
    box-shadow: 0 2px 0 rgba(120,90,40,.08), 0 8px 18px rgba(90,65,25,.12);
    transform: rotate(var(--rot, 0deg)); transition: transform .15s, box-shadow .15s;
  }
  .actor:nth-child(3n+1) { --rot: -1.2deg; }
  .actor:nth-child(3n+2) { --rot: .8deg; }
  .actor:nth-child(3n)   { --rot: -.4deg; }
  .actor::before {
    content: ""; position: absolute; top: -9px; left: 50%; width: 54px; height: 16px;
    transform: translateX(-50%) rotate(-3deg); background: rgba(205,180,120,.55); box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .actor:hover, .actor:focus-visible, .actor:active {
    transform: rotate(0deg) translateY(-3px); outline: none;
    box-shadow: 0 2px 0 rgba(120,90,40,.1), 0 14px 24px rgba(90,65,25,.2);
  }
  .actor .r {
    display: inline-block; font-size: 12px; color: var(--green-2); border: 1px solid rgba(63,96,73,.45);
    padding: 2px 10px; border-radius: 999px; background: rgba(63,96,73,.06); max-width: 100%; word-break: keep-all;
  }
  .actor .n { margin-top: 12px; font-family: var(--hand); font-weight: 700; font-size: 30px; line-height: 1.1; }
  .actor .m { margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* 편지지 */
  .back { background: none; border: 0; color: var(--green); font-size: 15px; cursor: pointer; padding: 6px 2px 12px; }
  .letter {
    position: relative; max-width: 560px; margin: 0 auto; padding: 22px 20px 20px;
    background:
      linear-gradient(90deg, transparent 38px, rgba(169,80,47,.22) 38px, rgba(169,80,47,.22) 39px, transparent 39px),
      repeating-linear-gradient(transparent 0 31px, rgba(80,110,90,.16) 31px 32px),
      var(--paper);
    border: 1px solid var(--line); box-shadow: 0 2px 0 rgba(120,90,40,.1), 0 16px 34px rgba(90,65,25,.18);
  }
  .letter::after {
    content: "다래골"; position: absolute; top: 14px; right: 14px; font-family: var(--hand); font-weight: 700; font-size: 16px;
    color: var(--rust); border: 2px solid var(--rust); border-radius: 50%; width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center; transform: rotate(12deg); opacity: .5;
  }
  .to { margin: 0 0 14px 22px; min-height: 64px; padding-right: 70px; }
  .to small { display: block; color: var(--muted); font-size: 13px; }
  .to b { font-family: var(--hand); font-size: 30px; color: var(--green); line-height: 1.15; }

  .stage {
    position: relative; background: #1b1a17; overflow: hidden; aspect-ratio: 3 / 4; max-height: 56vh;
    margin: 0 auto; border: 8px solid var(--paper-2); outline: 1px solid var(--line); box-shadow: 0 6px 16px rgba(60,40,15,.25);
  }
  .stage video { width: 100%; height: 100%; object-fit: cover; background: #1b1a17; }
  .stage video.mirror { transform: scaleX(-1); }
  .badge { position: absolute; top: 10px; left: 10px; background: rgba(30,40,32,.72); color: #fdf6e3; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .badge.rec::before { content: "● "; color: #ff7a5c; }

  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 120px; padding: 14px; border-radius: 6px; border: 1.5px solid var(--green);
    background: transparent; color: var(--green); font-family: var(--hand); font-weight: 700; font-size: 20px; cursor: pointer; text-align: center;
  }
  .btn.primary { background: var(--green); color: #fbf5e6; }
  .btn.rec { background: var(--rust); border-color: var(--rust); color: #fff7ea; }
  .btn.danger { border-color: var(--rust); color: var(--rust); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { font-size: 16px; padding: 8px 12px; min-width: 0; flex: none; }

  .field { display: block; margin-top: 14px; font-size: 14px; color: var(--muted); }
  input[type=text], input[type=password], input[type=email] {
    width: 100%; margin-top: 6px; padding: 11px 12px; border: 0; border-bottom: 1.5px solid var(--green);
    background: rgba(255,250,235,.7); color: var(--ink); font-family: var(--hand); font-size: 22px; -webkit-user-select: text; user-select: text;
  }
  input:focus { outline: none; background: #fffaf0; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 14px; line-height: 1.6; }
  .hint .lnk { color: var(--green); cursor: pointer; text-decoration: underline; }
  .err { color: var(--rust); font-size: 14px; margin-top: 12px; line-height: 1.5; }
  .bar { height: 8px; background: rgba(60,45,25,.12); margin-top: 14px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--green); transition: width .2s; }

  .done { text-align: center; padding: 34px 20px 28px; }
  .done .big { font-size: 56px; }
  .done h2 { margin: 6px 0; font-family: var(--hand); font-size: 34px; color: var(--green); }
  .done p { color: var(--muted); line-height: 1.7; margin: 0; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; letter-spacing: .08em; }

  /* 관리자 */
  .admin-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; margin: 14px 0 4px; }
  .tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 16px 0; }
  .tab { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; text-align: left; color: inherit; min-width: 0; }
  .tab.on { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .tab b { display: block; font-size: 15px; }
  .tab span { display: block; color: var(--muted); font-size: 12px; }
  .vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .v { background: var(--paper); border: 1px solid var(--line); padding: 10px; min-width: 0; }
  .v video { width: 100%; max-height: 320px; background: #1b1a17; }
  .v .t { margin: 8px 0; font-size: 13px; overflow-wrap: anywhere; }
  .v .acts { display: flex; gap: 8px; }
  .sec { font-family: var(--hand); font-size: 26px; color: var(--green); margin: 6px 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }

  .modal { position: fixed; inset: 0; background: rgba(40,30,15,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal .letter { width: 100%; max-width: 380px; }
  .modal .letter::after { display: none; }
</style>
</head>
<body class="kiosk">
<header>
  <div class="play" id="secret">〈 우 리 다 래 골 은 〉</div>
  <h1 id="h1">영상 편지함</h1>
  <div class="rule"></div>
  <p id="sub">전하고 싶은 마음을<br>한 통의 영상 편지로 남겨 주세요</p>
</header>

<main>
  <!-- 1단계: 선택 -->
  <section id="s-pick"><div class="grid" id="grid"></div></section>

  <!-- 2단계: 편지 쓰기 -->
  <section id="s-rec" hidden>
    <button class="back" id="back">← 다른 분 고르기</button>
    <div class="letter">
      <div class="to"><small id="to-role">받는 사람</small><b id="to-name"></b></div>
      <div class="stage">
        <video id="live" class="mirror" autoplay muted playsinline></video>
        <video id="review" class="hidden" controls playsinline></video>
        <div class="badge" id="badge">00:00 / 01:00</div>
      </div>
      <div class="row" id="ctl-start"><button class="btn primary" id="btn-cam">📷 카메라 켜기</button></div>
      <div class="row hidden" id="ctl-ready"><button class="btn rec" id="btn-rec">● 녹화 시작</button></div>
      <div class="row hidden" id="ctl-recording"><button class="btn" id="btn-stop">■ 녹화 끝내기</button></div>
      <div class="row hidden" id="ctl-after"><button class="btn" id="btn-retake">다시 찍기</button></div>

      <div id="send-box" class="hidden">
        <label class="field">보내는 사람 (이름이나 별명, 비워도 돼요)
          <input type="text" id="from" maxlength="20" placeholder="예: 민지 / 익명" autocomplete="off">
        </label>
        <label class="field">내가 보낸 영상을 소장하고 싶다면 메일 주소 (선택)
          <input type="email" id="email" maxlength="80" placeholder="예: name@example.com" autocomplete="off" inputmode="email" autocapitalize="off" spellcheck="false">
        </label>
        <div class="hint" style="margin-top:6px;font-size:12px">적어 주신 메일 주소는 영상 사본을 전달하는 용도로만 사용됩니다.</div>
        <div class="row"><button class="btn primary" id="btn-send">💌 편지 보내기</button></div>
        <div class="bar hidden" id="bar"><i id="bar-i"></i></div>
      </div>

      <div class="hint" id="hint">최대 60초까지 말씀하실 수 있어요.<br>카메라와 마이크 사용을 허용해 주세요.</div>
      <div class="err hidden" id="err"></div>
    </div>
  </section>

  <!-- 3단계: 완료 -->
  <section id="s-done" hidden>
    <div class="letter done">
      <div class="big">💌</div>
      <h2>편지가 우체통에 쏙!</h2>
      <p id="done-msg"></p>
      <div class="row"><button class="btn primary" id="again">다른 분께도 쓰기</button></div>
    </div>
  </section>

  <!-- 관리자 -->
  <section id="s-admin" hidden>
    <div class="admin-top">
      <button class="btn small primary" id="ad-all">전체 영상 내려받기</button>
      <button class="btn small" id="ad-csv">메일 주소 목록(엑셀) 내려받기</button>
      <button class="btn small" id="ad-exit">관객 화면으로 나가기</button>
    </div>
    <p class="muted" style="text-align:center" id="ad-total"></p>
    <p class="muted" style="text-align:center"><label class="check"><input type="checkbox" id="ad-auto"> 보낼 때마다 다운로드 폴더에도 자동 저장</label></p>
    <div class="tabs" id="tabs"></div>
    <h2 class="sec" id="ad-title"></h2>
    <div class="vids" id="vids"></div>
  </section>

  <div class="foot">〈우리 다래골은〉 · 출연진과 스태프에게 전하는 영상 편지</div>
</main>

<!-- 관리자 비밀번호 -->
<div class="modal hidden" id="pin-modal">
  <div class="letter">
    <div class="to" style="margin-left:0;padding-right:0;min-height:0"><b>관리자 확인</b></div>
    <label class="field">비밀번호
      <input type="password" id="pin" inputmode="numeric" autocomplete="off">
    </label>
    <div class="err hidden" id="pin-err">비밀번호가 맞지 않아요.</div>
    <div class="row"><button class="btn" id="pin-cancel">취소</button><button class="btn primary" id="pin-ok">확인</button></div>
  </div>
</div>

<script>
/* ===== 설정 ===== */
const ADMIN_PIN = "1234";          // ← 공연 전에 꼭 바꾸세요. (관리자 화면 비밀번호)
const MAX_SEC = 60;                // 영상 최대 길이(초)
const IDLE_MS = 90 * 1000;         // 조작이 없으면 첫 화면으로
const DONE_RETURN_MS = 8000;       // 전송 후 첫 화면 복귀
const ACTORS = [
  ["연출","강채원"],["무대감독","김진서"],["무대감독","신서윤"],["김덕수","이인혁"],["박경숙","김은채"],
  ["박경숙","박소윤"],["김철수","이수범"],["김영희","김민주"],["이만길","신윤호"],["정옥분/오갑순댁","정주선"],
  ["정옥분/오갑순댁","이지윤"],["이미영","이소정"],["이미영","홍채화"],["이용태","김현기"],["복남/덕구","정현수"],
  ["최판돌","이민재"],["정해선","김지아"],["정해선","김소윤"],["최영자","최유진"]
].map(([role, name], i) => ({ id: "actor" + String(i + 1).padStart(2, "0"), no: i + 1, role, name }));

/* ===== 저장소(IndexedDB) ===== */
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open("darae-video-letters", 1);
    r.onupgradeneeded = () => {
      const s = r.result.createObjectStore("videos", { keyPath: "key", autoIncrement: true });
      s.createIndex("actor", "actor");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
const tx = (mode, fn) => db().then((d) => new Promise((res, rej) => {
  const t = d.transaction("videos", mode); const out = fn(t.objectStore("videos"));
  t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
}));
const addVideo = (rec) => tx("readwrite", (s) => s.add(rec));
const allVideos = () => tx("readonly", (s) => s.getAll());
const delVideo = (key) => tx("readwrite", (s) => s.delete(key));

/* ===== 공통 ===== */
const $ = (id) => document.getElementById(id);
let actor = null, stream = null, recorder = null, chunks = [], blob = null, mime = "";
let timer = null, startedAt = 0, doneTimer = null, lastTouch = Date.now(), inAdmin = false;
const autoDl = () => { try { return localStorage.getItem("darae-autodl") !== "0"; } catch (e) { return true; } };

function show(step) {
  for (const s of ["pick", "rec", "done", "admin"]) $("s-" + s).hidden = s !== step;
  $("sub").hidden = step !== "pick";
  $("h1").textContent = step === "admin" ? "받은 영상 편지" : "영상 편지함";
  document.body.classList.toggle("kiosk", step !== "admin");
  inAdmin = step === "admin";
  window.scrollTo(0, 0);
  clearTimeout(doneTimer);
  if (step === "done") doneTimer = setTimeout(() => show("pick"), DONE_RETURN_MS);
}
function setCtl(name) { for (const c of ["start", "ready", "recording", "after"]) $("ctl-" + c).classList.toggle("hidden", c !== name); }
function showErr(msg) { $("err").textContent = msg; $("err").classList.toggle("hidden", !msg); }
function fmt(s) { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function extFor(type) { type = (type || "").toLowerCase(); return type.includes("mp4") ? "mp4" : type.includes("quicktime") ? "mov" : "webm"; }
function safe(s) { return String(s).replace(/[\\/:*?"<>|\s]+/g, "_").replace(/^_+|_+$/g, "") || "익명"; }
function stamp(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function fileNameOf(r) {
  const a = ACTORS.find((x) => x.id === r.actor) || { no: 0, role: "", name: "" };
  return `${String(a.no).padStart(2, "0")}_${safe(a.name)}(${safe(a.role)})_from_${safe(r.from)}_${stamp(new Date(r.at))}.${extFor(r.type)}`;
}
function download(r) {
  const url = URL.createObjectURL(r.blob);
  const a = document.createElement("a"); a.href = url; a.download = fileNameOf(r);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ===== 카드 ===== */
for (const a of ACTORS) {
  const b = document.createElement("button");
  b.className = "actor";
  b.innerHTML = '<div class="r"></div><div class="n"></div><div class="m">✉ 편지 쓰기</div>';
  b.querySelector(".r").textContent = a.role;
  b.querySelector(".n").textContent = a.name;
  b.onclick = () => pick(a);
  $("grid").appendChild(b);
}

function pick(a) {
  actor = a;
  $("to-role").textContent = "받는 사람 · " + a.role;
  $("to-name").textContent = a.name + " 님께";
  resetRecorder(); show("rec");
  openCamera();                      // 바로 촬영할 수 있게 카메라를 자동으로 켭니다
}

/* ===== 녹화 ===== */
// 카메라는 한 번 켜면 프로그램을 닫을 때까지 유지합니다(허용 창이 반복해서 뜨지 않도록). 여기서는 미리보기 화면만 떼어 냅니다.
function stopStream() { $("live").srcObject = null; }
function camAlive() { return !!stream && stream.getTracks().length > 0 && stream.getTracks().every((t) => t.readyState === "live"); }
let streamP = null;
function ensureStream() {
  if (camAlive()) return Promise.resolve(stream);
  if (!streamP) {
    streamP = navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } }, audio: true })
      .then((s) => { stream = s; return s; })
      .finally(() => { streamP = null; });
  }
  return streamP;
}
function resetRecorder() {
  clearInterval(timer); stopStream();
  if (recorder && recorder.state !== "inactive") { recorder.onstop = null; try { recorder.stop(); } catch (e) {} }
  recorder = null; chunks = []; blob = null;
  if ($("review").src) { URL.revokeObjectURL($("review").src); $("review").removeAttribute("src"); }
  $("review").classList.add("hidden"); $("live").classList.remove("hidden");
  $("badge").textContent = `00:00 / ${fmt(MAX_SEC)}`; $("badge").classList.remove("rec");
  $("send-box").classList.add("hidden"); $("bar").classList.add("hidden"); $("bar-i").style.width = "0";
  $("btn-send").disabled = false; $("from").value = ""; $("email").value = "";
  $("hint").innerHTML = "최대 60초까지 말씀하실 수 있어요.<br>카메라와 마이크 사용을 허용해 주세요.";
  setCtl("start"); showErr("");
}
async function openCamera() {
  showErr("");
  if (!navigator.mediaDevices || !window.MediaRecorder) { showErr("이 브라우저에서는 녹화를 쓸 수 없어요. 크롬(Chrome)으로 열어 주세요."); return; }
  try {
    await ensureStream();
    if ($("s-rec").hidden) return;
    $("live").srcObject = stream; setCtl("ready");
  } catch (e) {
    showErr("카메라/마이크를 켤 수 없어요. 주소창 왼쪽의 자물쇠(또는 카메라 아이콘)에서 카메라와 마이크를 ‘허용’한 뒤 ‘카메라 켜기’를 눌러 주세요.");
  }
}
function startRec() {
  const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
  mime = types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
  chunks = [];
  try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 2_000_000 } : undefined); }
  catch (e) { showErr("녹화를 시작할 수 없어요."); return; }
  mime = recorder.mimeType || mime || "video/webm";
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = finishRec;
  recorder.start(1000);
  startedAt = Date.now(); $("badge").classList.add("rec"); setCtl("recording");
  timer = setInterval(() => {
    const s = (Date.now() - startedAt) / 1000;
    $("badge").textContent = `${fmt(s)} / ${fmt(MAX_SEC)}`;
    if (s >= MAX_SEC) stopRec();
  }, 250);
}
function stopRec() { clearInterval(timer); if (recorder && recorder.state !== "inactive") recorder.stop(); }
function finishRec() {
  blob = new Blob(chunks, { type: mime.split(";")[0] });
  stopStream();
  const v = $("review");
  v.src = URL.createObjectURL(blob);
  v.classList.remove("hidden"); $("live").classList.add("hidden"); $("badge").classList.remove("rec");
  setCtl("after"); $("send-box").classList.remove("hidden");
  $("hint").textContent = "영상을 확인해 보시고, 마음에 드시면 편지 보내기를 눌러 주세요.";
}

async function send() {
  if (!blob || !actor) return;
  const email = $("email").value.trim();
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr("메일 주소를 다시 확인해 주세요. 비워 두셔도 보낼 수 있어요."); return; }
  $("btn-send").disabled = true; showErr("");
  $("bar").classList.remove("hidden"); $("bar-i").style.width = "60%";
  const rec = { actor: actor.id, from: $("from").value.trim() || "익명", email, at: Date.now(), type: blob.type || "video/webm", size: blob.size, blob };
  try {
    await addVideo(rec);
  } catch (e) {
    showErr("이 브라우저에 저장하지 못했어요. 저장 공간을 확인해 주세요."); $("btn-send").disabled = false; $("bar").classList.add("hidden"); return;
  }
  if (autoDl()) { try { download(rec); } catch (e) {} }   // 다운로드 폴더에 백업 사본
  $("bar-i").style.width = "100%";
  $("done-msg").innerHTML = `${actor.name} 님께 영상 편지가 전해졌어요.<br>따뜻한 마음 고맙습니다.` + (rec.email ? "<br>메일 주소도 잘 받아 두었어요." : "");
  resetRecorder(); show("done");
}

$("btn-cam").onclick = openCamera;
$("btn-rec").onclick = startRec;
$("btn-stop").onclick = stopRec;
$("btn-retake").onclick = () => { resetRecorder(); openCamera(); };
$("btn-send").onclick = send;
$("back").onclick = () => { resetRecorder(); show("pick"); };
$("again").onclick = () => show("pick");

/* ===== 자동 초기화 ===== */
["pointerdown", "keydown", "touchstart"].forEach((ev) => addEventListener(ev, () => { lastTouch = Date.now(); }, { passive: true }));
setInterval(() => {
  const onPick = !$("s-pick").hidden;
  const busy = (recorder && recorder.state === "recording") || $("btn-send").disabled;
  if (!onPick && !inAdmin && !busy && Date.now() - lastTouch > IDLE_MS) { resetRecorder(); show("pick"); }
}, 1000);

/* ===== 관리자 (맨 위 〈 우 리 다 래 골 은 〉 글자를 5번 빠르게 누르면 열림) ===== */
let taps = [];
$("secret").addEventListener("click", () => {
  const now = Date.now(); taps = taps.filter((t) => now - t < 3000); taps.push(now);
  if (taps.length >= 5 && !inAdmin) { taps = []; $("pin").value = ""; $("pin-err").classList.add("hidden"); $("pin-modal").classList.remove("hidden"); $("pin").focus(); }
});
addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a") && !inAdmin) { $("pin").value = ""; $("pin-err").classList.add("hidden"); $("pin-modal").classList.remove("hidden"); $("pin").focus(); }
  if (e.key === "Enter" && !$("pin-modal").classList.contains("hidden")) $("pin-ok").click();
  if (e.key === "Escape") $("pin-modal").classList.add("hidden");
});
$("pin-cancel").onclick = () => $("pin-modal").classList.add("hidden");
$("pin-ok").onclick = () => {
  if ($("pin").value === ADMIN_PIN) { $("pin-modal").classList.add("hidden"); resetRecorder(); openAdmin(); }
  else $("pin-err").classList.remove("hidden");
};
$("ad-exit").onclick = () => { revokeAdminUrls(); show("pick"); };

let adminActor = ACTORS[0].id, adminUrls = [];
function revokeAdminUrls() { adminUrls.forEach((u) => URL.revokeObjectURL(u)); adminUrls = []; $("vids").innerHTML = ""; }
async function openAdmin() { show("admin"); $("ad-auto").checked = autoDl(); await renderAdmin(); }
$("ad-auto").onchange = (e) => { try { localStorage.setItem("darae-autodl", e.target.checked ? "1" : "0"); } catch (err) {} };

async function renderAdmin() {
  revokeAdminUrls();
  const list = await allVideos();
  const count = {}; list.forEach((r) => { count[r.actor] = (count[r.actor] || 0) + 1; });
  const mb = list.reduce((n, r) => n + r.size, 0) / 1048576;
  $("ad-total").textContent = `전체 ${list.length}개 · ${mb.toFixed(1)}MB (이 컴퓨터의 이 브라우저에 저장됨)`;
  $("tabs").innerHTML = "";
  for (const a of ACTORS) {
    const b = document.createElement("button");
    b.className = "tab" + (a.id === adminActor ? " on" : "");
    b.innerHTML = "<b></b><span></span>";
    b.querySelector("b").textContent = a.name;
    b.querySelector("span").textContent = `${a.role} · ${count[a.id] || 0}개`;
    b.onclick = () => { adminActor = a.id; renderAdmin(); };
    $("tabs").appendChild(b);
  }
  const a = ACTORS.find((x) => x.id === adminActor);
  $("ad-title").textContent = `${a.name} (${a.role}) 님께 온 영상`;
  const mine = list.filter((r) => r.actor === a.id).sort((x, y) => y.at - x.at);
  const box = $("vids");
  if (!mine.length) { box.innerHTML = '<div class="muted">아직 받은 영상이 없어요.</div>'; return; }
  for (const r of mine) {
    const url = URL.createObjectURL(r.blob); adminUrls.push(url);
    const d = document.createElement("div"); d.className = "v";
    d.innerHTML = '<video controls preload="metadata" playsinline></video><div class="t"></div><div class="acts"><button class="btn small">다운로드</button><button class="btn small danger">삭제</button></div>';
    d.querySelector("video").src = url;
    const dt = new Date(r.at);
    d.querySelector(".t").textContent = `${r.from} · ${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")} · ${(r.size / 1048576).toFixed(1)}MB${r.email ? " · ✉ " + r.email : ""}`;
    const [bd, bx] = d.querySelectorAll("button");
    bd.onclick = () => download(r);
    let armed = false;
    bx.onclick = async () => {
      if (!armed) { armed = true; bx.textContent = "정말 삭제?"; setTimeout(() => { armed = false; bx.textContent = "삭제"; }, 3000); return; }
      await delVideo(r.key); renderAdmin();
    };
    box.appendChild(d);
  }
}
// 메일 주소를 적은 영상만 모아 엑셀(CSV)로 내려받기: 어떤 영상(파일명)을 누구에게 보낼지 한눈에 보입니다.
$("ad-csv").onclick = async () => {
  const list = (await allVideos()).filter((r) => r.email).sort((x, y) => x.at - y.at);
  if (!list.length) { $("ad-csv").textContent = "메일 주소가 아직 없어요"; setTimeout(() => { $("ad-csv").textContent = "메일 주소 목록(엑셀) 내려받기"; }, 2500); return; }
  const cell = (v) => { v = String(v ?? ""); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const rows = [["받을 메일 주소", "보낸 사람", "받는 사람(출연진/스태프)", "역할", "보낸 시각", "영상 파일 이름"]];
  for (const r of list) {
    const a = ACTORS.find((x) => x.id === r.actor) || { name: "", role: "" };
    const d = new Date(r.at);
    rows.push([r.email, r.from, a.name, a.role, `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`, fileNameOf(r)]);
  }
  const csv = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = "메일주소목록_" + stamp(new Date()) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
};
$("ad-all").onclick = async () => {
  const list = (await allVideos()).sort((x, y) => x.at - y.at);
  if (!list.length) return;
  $("ad-all").disabled = true;
  for (let i = 0; i < list.length; i++) { download(list[i]); $("ad-all").textContent = `내려받는 중 ${i + 1}/${list.length}`; await new Promise((r) => setTimeout(r, 600)); }
  $("ad-all").textContent = "전체 영상 내려받기"; $("ad-all").disabled = false;
};

// 프로그램을 열자마자 카메라·마이크 허용을 미리 받아 둡니다(운영자가 한 번만 ‘허용’). 거절돼도 관객 화면에서 다시 안내합니다.
if (navigator.mediaDevices && window.MediaRecorder) ensureStream().catch(() => {});
addEventListener("pagehide", () => { if (stream) stream.getTracks().forEach((t) => t.stop()); });

// 브라우저가 저장 공간을 임의로 비우지 않도록 요청
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
